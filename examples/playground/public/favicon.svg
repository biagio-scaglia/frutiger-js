<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Orb Gradient -->
    <radialGradient id="aeroOrb" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#7dd3fc" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#034870" />
    </radialGradient>
    <!-- Specular Dome Cap Reflection -->
    <linearGradient id="specularCap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <!-- Bottom Caustic Rim Glow -->
    <linearGradient id="causticGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>
    <!-- Filter for subtle droplet shadow -->
    <filter id="orbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Ambient Shadow -->
  <circle cx="32" cy="33" r="26" fill="url(#aeroOrb)" filter="url(#orbShadow)" />

  <!-- Base Spherical Liquid Body -->
  <circle cx="32" cy="32" r="26" fill="url(#aeroOrb)" stroke="rgba(255, 255, 255, 0.6)" stroke-width="1.5" />

  <!-- Bottom Caustic Rim Light -->
  <ellipse cx="32" cy="46" rx="19" ry="8" fill="url(#causticGlow)" />

  <!-- Top Gloss Highlight Oval -->
  <path d="M 14 26 C 14 14 50 14 50 26 C 45 18 19 18 14 26 Z" fill="url(#specularCap)" />
  <ellipse cx="26" cy="18" rx="6" ry="3" fill="#ffffff" opacity="0.85" transform="rotate(-20 26 18)" />

  <!-- Pure White Micro Glint -->
  <circle cx="23" cy="16" r="2" fill="#ffffff" />
</svg>
