name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build & Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run Full Quality Gate
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Inspect Package Tarballs
        run: |
          npm pack --dry-run --workspace=@frutiger-js/core
          npm pack --dry-run --workspace=@frutiger-js/react

      - name: Publish @frutiger-js/core
        run: npm publish --workspace=@frutiger-js/core --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

      - name: Publish @frutiger-js/react
        run: npm publish --workspace=@frutiger-js/react --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true
